# Smart Poultry Management System - Environment Configuration Template
# Copy this file to application-local.properties or configure environment variables in production.

# Server Configuration
server.port=8080
server.servlet.context-path=/api/v1

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/poultry_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Migration (Flyway)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Hibernate JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Security & JWT Configuration
app.jwt.secret=your_64_char_base64_secret_key_here
app.jwt.expiration-ms=86400000
app.jwt.header=Authorization
app.jwt.prefix=Bearer 

# CORS Allowed Origins (Comma-separated)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Logging Configuration
logging.level.root=INFO
logging.level.com.poultry.backend=DEBUG
logging.file.name=logs/poultry-backend.log
