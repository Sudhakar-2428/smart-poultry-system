server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: poultry-backend
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:h2:file:./data/poultry_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: '1'
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Spring Security & JWT Custom Properties
app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1hbmQtc3VwZXItc2VjcmV0LWtleS1mb3Itc21hcnQtcG91bHRyeS1tYW5hZ2VtZW50LXN5c3RlbS1iYWNrZW5kLXdpdGgtNjQtYnl0ZXMtbWluaW11bS1zZWN1cml0eS1mb3ItSFM1MTI=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    header: Authorization
    prefix: "Bearer "
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://smart-poultry-system.vercel.app}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,Origin,X-Requested-With,Access-Control-Request-Method,Access-Control-Request-Headers
    exposed-headers: Authorization,Link,X-Total-Count
    allow-credentials: true
    max-age: 3600
  weather:
    api-key: ${WEATHER_API_KEY:}

# Springdoc / Swagger API Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
  show-actuator: false

# Logging Configuration
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.poultry.backend: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/poultry-backend.log
